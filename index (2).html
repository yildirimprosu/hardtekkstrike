<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060a12"><title>HARDTEKK STRIKE</title>
<style>:root{--bg:#060a12;--blue:#2d8cff;--blue2:#1a5fd0;--red:#ff4040;--glass:rgba(10,18,34,.78);--line:rgba(80,150,255,.28);--tx:#e8f0ff;--mut:#8fa4c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--tx);font-family:'Rajdhani','Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-weight:600}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#050810}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx);user-select:text;-webkit-user-select:text;touch-action:auto}
.layer{position:fixed;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
/* ---- menü ---- */
#topbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 28px;pointer-events:none}
#topbar>*{pointer-events:auto}
.logo{line-height:.82;transform:skewX(-8deg);filter:url(#rough);text-transform:uppercase;font-weight:900;letter-spacing:1px}
.logo b{display:block;font-size:46px;color:#fff;text-shadow:0 3px 0 #0006}
.logo i{display:block;font-size:42px;color:var(--blue);font-style:italic;margin-left:34px;text-shadow:0 0 22px #2d8cff88}
.logo small{display:block;font-size:12px;letter-spacing:7px;color:#cfe0ff;margin:6px 0 0 4px;font-weight:700}
.chips{display:flex;gap:10px;align-items:center}
.chip{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);padding:8px 14px;border-radius:4px;backdrop-filter:blur(8px);clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.avatar{width:42px;height:42px;background:linear-gradient(135deg,var(--blue),#0a2a66);display:grid;place-items:center;font-weight:900;font-size:20px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.chip .nm{font-size:18px;line-height:1}.chip .lv{font-size:12px;color:var(--mut);letter-spacing:1px}
.xpb{height:4px;background:#1b2a46;margin-top:4px;width:120px}.xpb i{display:block;height:100%;background:var(--blue)}
.dot{width:9px;height:9px;border-radius:50%;background:#e05050;box-shadow:0 0 8px currentColor;color:#e05050}.dot.on{background:#35e08a;color:#35e08a}
#nav{transition:.3s;position:absolute;left:34px;top:50%;transform:translateY(-44%);display:flex;flex-direction:column;gap:10px;width:min(340px,42vw)}
.nb{position:relative;text-align:left;padding:14px 22px;font-size:22px;letter-spacing:3px;text-transform:uppercase;background:var(--glass);border:1px solid var(--line);border-left:4px solid var(--blue2);backdrop-filter:blur(8px);transition:.18s;transform:skewX(-6deg);overflow:hidden}
.nb span{display:inline-block;transform:skewX(6deg)}
.nb:hover,.nb:active{background:rgba(30,80,170,.55);border-left-color:#7fb8ff;padding-left:34px;box-shadow:0 0 26px #2d8cff55}
.nb.play{font-size:44px;font-weight:900;padding:22px 26px;letter-spacing:5px;background:linear-gradient(100deg,#1a6fff,#0c3a9a);border-color:#7fb8ff;box-shadow:0 0 34px #2d8cff77;animation:pulse 2.4s infinite}
.nb.play:hover{padding-left:38px;filter:brightness(1.2)}
@keyframes pulse{50%{box-shadow:0 0 56px #2d8cffaa}}
.nb .bd{position:absolute;right:12px;top:50%;transform:translateY(-50%) skewX(6deg);background:var(--red);color:#fff;font-size:13px;padding:1px 8px;border-radius:9px;letter-spacing:0}
#foot{position:absolute;right:28px;bottom:16px;text-align:right;color:var(--mut);font-size:13px;letter-spacing:3px;pointer-events:none}
#hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:var(--mut);font-size:13px;letter-spacing:2px;pointer-events:none}
/* ---- paneller ---- */
#panel{position:fixed;top:0;bottom:0;right:0;width:min(720px,100vw);max-width:100vw;padding:74px 28px 24px;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,#060a1200,#060a12ee 12%);overflow:auto;z-index:20;touch-action:pan-y}
#panel.open{transform:none}
#panel h2{margin:0 0 14px;font-size:34px;letter-spacing:5px;text-transform:uppercase;font-style:italic;font-weight:900}
#panel h2 em{color:var(--blue);font-style:italic}
.x{position:fixed;top:18px;right:24px;z-index:30;width:44px;height:44px;font-size:26px;background:var(--glass);border:1px solid var(--line);display:none}
#panel.open~.x{display:block}
.card{background:var(--glass);border:1px solid var(--line);padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:3px;color:var(--mut);text-transform:uppercase}
.grid{display:grid;gap:10px}.g5{grid-template-columns:repeat(5,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.opt{padding:12px 6px;text-align:center;background:#0b1730;border:1px solid var(--line);font-size:20px;letter-spacing:2px;transition:.15s;position:relative}
.opt small{display:block;font-size:11px;color:var(--mut);letter-spacing:1px}
.opt:hover{border-color:#7fb8ff}.opt.sel{background:linear-gradient(135deg,#1a5fd0,#0b2a66);border-color:#9cc8ff;box-shadow:0 0 18px #2d8cff66}
.btn{padding:12px 22px;background:linear-gradient(100deg,#1f78ff,#0f45b0);border:1px solid #8cc0ff;font-size:20px;letter-spacing:3px;text-transform:uppercase;transition:.15s}
.btn:hover{filter:brightness(1.25)}.btn.alt{background:#0b1730;border-color:var(--line)}.btn.red{background:linear-gradient(100deg,#d03030,#7a1515);border-color:#ff8a8a}.btn[disabled]{opacity:.4;pointer-events:none}
.btn.big{width:100%;font-size:26px;padding:16px;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1}
input[type=text]{background:#091227;border:1px solid var(--line);padding:11px 14px;font-size:20px;letter-spacing:2px;min-width:0;width:100%}
input[type=text]:focus{outline:0;border-color:#7fb8ff}
input[type=range]{width:100%;accent-color:var(--blue)}
.set{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid #ffffff10}.set label{flex:0 0 42%;font-size:18px}.set .v{flex:0 0 52px;text-align:right;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tab{flex:1;padding:12px;background:#0b1730;border:1px solid var(--line);font-size:18px;letter-spacing:2px;text-transform:uppercase}.tab.sel{background:var(--blue2);border-color:#9cc8ff}
.pl{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0a1328;border-left:4px solid var(--blue);margin-bottom:6px;font-size:20px}.pl.r{border-color:var(--red)}.pl .tg{margin-left:auto;font-size:13px;color:var(--mut);letter-spacing:2px}
.code{font-size:44px;letter-spacing:10px;font-weight:900;color:#9cc8ff;text-align:center;padding:6px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffffff10;font-size:19px}.stat b{color:#9cc8ff}
.sw{display:inline-block;width:100%;height:20px;margin-top:6px;border:1px solid #fff3}
.note{color:var(--mut);font-size:15px;line-height:1.35;margin:6px 0}.err{color:#ff8a8a}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:60;background:#0b1a3aee;border:1px solid #7fb8ff;padding:10px 22px;font-size:20px;letter-spacing:2px;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-weight:700}
#hud>*{position:absolute}
#score{top:10px;left:50%;transform:translateX(-50%);text-align:center}
#score .bar{display:flex;align-items:stretch;gap:2px;font-size:36px;font-weight:900}
#score .bar>div{padding:2px 18px;min-width:64px}#sc0{background:#1b5ec8cc}#sc1{background:#c83030cc}#st{background:#0a1220cc;min-width:100px!important;font-size:34px}
#score .sub{font-size:15px;letter-spacing:3px;color:#cfe0ff;text-shadow:0 1px 3px #000}
#mini{top:14px;left:14px;width:150px;height:150px;border-radius:50%;border:2px solid #2d8cffaa;background:#000a;box-shadow:0 0 18px #000a}
#feed{top:10px;right:10px;text-align:right;width:320px}
.kf{display:inline-flex;gap:8px;align-items:center;background:#000a;padding:3px 10px;margin-bottom:3px;font-size:17px;border-left:3px solid #fff0}.kf.me{border:2px solid var(--red);border-left-width:2px}.kf .b{color:#6fb0ff}.kf .r{color:#ff6a6a}.kf i{font-style:normal;color:#cfd8ea;font-size:14px;letter-spacing:1px}.kf .hs{color:#ff4040}
#chat{left:14px;bottom:150px;width:min(360px,50vw);font-size:17px;text-shadow:0 1px 3px #000}
#chat div{background:#0008;padding:2px 8px;margin-top:2px}#chatin{pointer-events:auto;width:100%;margin-top:4px;font-size:17px;padding:6px 10px}
#stats{left:14px;bottom:14px;display:flex;gap:18px;font-size:42px;font-weight:800;text-shadow:0 2px 6px #000;align-items:center}
#stats .ic{font-size:30px;margin-right:6px}.hp.low{color:#ff5050}
#ammo{right:24px;bottom:14px;text-align:right;font-size:50px;font-weight:800;text-shadow:0 2px 6px #000}#ammo small{font-size:26px;color:#cdd7ea}
#slots{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px}
.slot{pointer-events:auto;width:118px;height:62px;background:#0009;border:2px solid #fff2;text-align:center;font-size:17px;padding-top:6px;letter-spacing:1px}.slot.sel{border-color:#f5c542;background:#2a2410aa}.slot small{display:block;font-size:13px;color:#cdd7ea}
#cross{left:50%;top:50%;width:0;height:0}#cross i{position:absolute;background:#7dffb0;box-shadow:0 0 2px #000}
#hm{left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%) rotate(45deg);opacity:0}
#hm:before,#hm:after{content:'';position:absolute;background:#fff}#hm:before{left:13px;top:0;width:3px;height:30px}#hm:after{top:13px;left:0;height:3px;width:30px}#hm.h:before,#hm.h:after{background:#ff3030}
#scope{inset:0;pointer-events:none;overflow:hidden;background:transparent}
#scope:before{content:'';position:absolute;left:50%;top:50%;width:2px;height:46px;transform:translate(-50%,-50%);background:linear-gradient(transparent,rgba(255,255,255,.92) 22%,rgba(255,255,255,.92) 78%,transparent);filter:drop-shadow(0 0 3px #9b70ff)}#scope:after{content:'';position:absolute;left:50%;top:50%;width:46px;height:2px;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.92) 22%,rgba(255,255,255,.92) 78%,transparent);filter:drop-shadow(0 0 3px #9b70ff)}
#vig{inset:0;box-shadow:inset 0 0 160px 40px #f00;opacity:0}
#bn{left:0;right:0;top:22%;text-align:center;font-size:56px;font-weight:900;letter-spacing:8px;text-transform:uppercase;font-style:italic;text-shadow:0 0 30px #2d8cff,0 3px 8px #000;opacity:0;transition:opacity .3s}#bn.on{opacity:1}#bn small{display:block;font-size:22px;letter-spacing:5px;color:#cfe0ff}
#spec{left:50%;bottom:90px;transform:translateX(-50%);font-size:22px;letter-spacing:3px;background:#000a;padding:6px 18px}
#dirs{left:50%;top:50%}.dir{position:absolute;width:0;height:0;left:-14px;top:-150px;border:14px solid transparent;border-bottom:34px solid #f33;transform-origin:14px 164px;opacity:.9}
#fps{right:10px;bottom:90px;font-size:15px;color:#9fd}
#sb{left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,94vw);background:#050a14ee;border:1px solid var(--line);padding:14px;display:none}#sb.on{display:block}
#sb table{width:100%;border-collapse:collapse;font-size:20px}#sb th{color:var(--mut);font-size:14px;letter-spacing:2px;text-align:left;padding:4px 8px}#sb td{padding:5px 8px}.tb td:first-child{border-left:4px solid var(--blue)}.tr td:first-child{border-left:4px solid var(--red)}#sb tr.me td{background:#ffffff14}
#sb h4{margin:8px 0 4px;letter-spacing:4px}
#ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#000a;backdrop-filter:blur(6px)}
#ov .box{background:var(--glass);border:1px solid var(--line);padding:26px 34px;min-width:min(420px,90vw);max-height:92vh;overflow:auto;text-align:center}
#ov h1{margin:0 0 12px;font-size:44px;letter-spacing:6px;font-style:italic;text-transform:uppercase}#ov .btn{display:block;width:100%;margin-top:10px}
#click{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0007;font-size:30px;letter-spacing:6px;text-transform:uppercase}
/* ---- dokunmatik ---- */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#touch>*{position:absolute;pointer-events:auto}
#touch{--b:min(70px,16vh)}
#joy{left:3%;bottom:8%;width:min(170px,40vh);height:min(170px,40vh);border-radius:50%;background:#ffffff14;border:2px solid #ffffff44}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21%;border-radius:50%;background:#ffffff55;border:2px solid #fff8}
.tb2{width:var(--b);height:var(--b);border-radius:50%;background:#2a2e36aa;border:2px solid #ffffff55;display:grid;place-items:center;font-size:calc(var(--b)*.42);color:#fff;text-shadow:0 1px 3px #000}.tb2.on{background:#2d8cffcc}
#bFire{right:4%;bottom:calc(6% + var(--b)*2 + 26px);width:calc(var(--b)*1.35);height:calc(var(--b)*1.35)}
#bJump{right:4%;bottom:6%;width:calc(var(--b)*1.15);height:calc(var(--b)*1.15)}
#bCr{right:calc(4% + var(--b)*1.15 + 14px);bottom:6%}
#bRel{right:calc(4% + var(--b)*1.15 + 14px);bottom:calc(6% + var(--b) + 14px)}
#bScope{right:calc(4% + var(--b)*2.6);bottom:36%}
#bView{right:calc(4% + var(--b)*2.6);bottom:calc(36% + var(--b) + 12px);font-size:calc(var(--b)*.32)}
#bSb{left:calc(50% - 190px);top:8px;width:46px;height:30px;border-radius:6px;font-size:13px}
#bMenu{right:10px;top:8px;width:42px;height:42px;font-size:22px}
body.touch #stats{left:14px;bottom:auto;top:calc(112px + 10px);font-size:24px;gap:10px}
body.touch #ammo{right:64px;bottom:auto;top:6px;font-size:28px}
body.touch #feed{top:56px}
body.touch #slots{bottom:6px}
#rot{position:fixed;inset:0;z-index:90;background:#050a14;display:none;place-items:center;text-align:center;font-size:26px;letter-spacing:3px;padding:30px}
@media (min-width:901px){#panel{width:min(720px,62vw)}}
@media (max-width:900px){.logo b{font-size:30px}.logo i{font-size:28px;margin-left:20px}.logo small{display:none}.nb{font-size:17px;padding:10px 16px}.nb.play{font-size:30px;padding:14px 18px}#nav{left:14px;gap:7px;top:56%}.chip .xpb{width:80px}#panel{padding:64px 14px 14px}#panel h2{font-size:26px}.g5{grid-template-columns:repeat(3,1fr)}#topbar{padding:10px 14px}.avatar{width:34px;height:34px}.chip{padding:5px 10px}#mini{width:112px;height:112px}#score .bar{font-size:26px}#feed{width:240px}.kf{font-size:14px}#bn{font-size:34px}.slot{width:84px;height:48px;font-size:13px;padding-top:3px}#stats{font-size:30px}#ammo{font-size:36px}#chat{bottom:88px}}
#panel,#panel *{touch-action:pan-y}
#panel{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (max-height:560px){#panel{padding:52px 16px 16px}#panel h2{font-size:22px;margin-bottom:8px}.card{padding:10px;margin-bottom:8px}.card h3{margin-bottom:6px;font-size:13px}.opt{padding:8px 4px;font-size:17px}.btn{padding:9px 16px;font-size:17px}.btn.big{font-size:20px;padding:11px}.tab{padding:8px;font-size:15px}.code{font-size:30px}.x{top:8px;right:10px;width:38px;height:38px}#topbar{padding:8px 14px}.logo b{font-size:26px}.logo i{font-size:24px}}

#xxqSplash{position:fixed;inset:0;z-index:120;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#26145e 0%,#100b2b 42%,#050510 78%,#020208 100%);color:#fff;animation:xxqFade .55s ease both}#xxqSplash:before{content:'';position:absolute;width:min(72vw,520px);aspect-ratio:1;border:1px solid #9c6bff55;border-radius:50%;box-shadow:0 0 45px #793dff22,inset 0 0 45px #793dff22;animation:xxqOrbit 11s linear infinite}#xxqSplash:after{content:'';position:absolute;inset:-40%;background:linear-gradient(112deg,transparent 43%,#a77aff18 49%,#d9c4ff44 50%,#a77aff18 51%,transparent 57%);transform:translateX(-70%);animation:xxqSweep 4.8s ease-in-out .4s both}.xxqInner{position:relative;z-index:1;text-align:center;padding:24px;animation:xxqRise .9s cubic-bezier(.16,1,.3,1) both}#xxqSplash .xxqMark{font-size:clamp(48px,11vw,88px);font-weight:1000;letter-spacing:.22em;padding-left:.22em;background:linear-gradient(100deg,#fff 10%,#d9c2ff 42%,#9d65ff 70%,#fff 95%);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 0 28px #9b5cff88,0 0 70px #643bff88;animation:xxqPulse 1.8s ease-in-out infinite alternate}#xxqSplash .xxqSub{margin-top:10px;color:#d5c2ff;letter-spacing:.7em;padding-left:.7em;font-size:clamp(12px,2.8vw,18px);opacity:0;animation:xxqReveal .65s ease .35s forwards}#xxqSplash .xxqLine{height:2px;width:min(280px,68vw);margin:25px auto 0;background:linear-gradient(90deg,transparent,#a66cff,#fff,#a66cff,transparent);box-shadow:0 0 18px #925cff;transform:scaleX(0);transform-origin:center;animation:xxqLine .7s ease .55s forwards}@keyframes xxqFade{from{opacity:0}to{opacity:1}}@keyframes xxqRise{from{opacity:0;transform:translateY(28px) scale(.82);filter:blur(9px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes xxqReveal{from{opacity:0;letter-spacing:1em;filter:blur(5px)}to{opacity:1;letter-spacing:.7em;filter:blur(0)}}@keyframes xxqLine{to{transform:scaleX(1)}}@keyframes xxqPulse{from{filter:brightness(.9)}to{filter:brightness(1.35)}}@keyframes xxqOrbit{to{transform:rotate(360deg)}}@keyframes xxqSweep{0%{transform:translateX(-70%)}65%,100%{transform:translateX(70%)}}@media(prefers-reduced-motion:reduce){#xxqSplash:before,#xxqSplash:after,#xxqSplash .xxqMark,#xxqSplash .xxqSub,#xxqSplash .xxqLine,.xxqInner{animation:none!important;opacity:1;transform:none}}
</style></head><body>

 <div id="topbar"><div class="logo"><b>Hardtekk</b><i>Strike</i><small>XXQ NETWORK</small></div>

 <canvas id="mini" width="300" height="300"></canvas>
 <div id="score"><div class="bar"><div id="sc0">0</div><div id="st">1:45</div><div id="sc1">0</div></div><div class="sub" id="sub">5v5</div></div>
 <div id="feed"></div><div id="chat"></div>
 <div id="stats"><div class="hp" id="hp"><span class="ic">✚</span><span id="hpv">100</span></div><div><span class="ic">⛨</span><span id="arv">100</span></div></div>

 RX(a){const c=Math.cos(a),s=Math.sin(a),m=M4.id();m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;},

function blockedAt(x,z,y,h){for(const s of MAP.solids)if(x+RAD>s.x0&&x-RAD<s.x1&&z+RAD>s.z0&&z-RAD<s.z1&&s.y1>y+STEP&&s.y0<y+h)return true;return false;}
function groundAt(x,z,y){let g=0;for(const s of MAP.solids)if(x+.2>s.x0&&x-.2<s.x1&&z+.2>s.z0&&z-.2<s.z1&&s.y1<=y+STEP+.01&&s.y1>g&&s.y0<=y+STEP)g=s.y1;return g;}
function moveEnt(e,dt,wx,wz,speed,jump){
 const h=1.8-e.crouch*.45,ac=e.ground?12:2.2;
 e.vx+=(wx*speed-e.vx)*Math.min(1,ac*dt);e.vz+=(wz*speed-e.vz)*Math.min(1,ac*dt);
 if(jump&&e.ground){e.vy=5.9;e.ground=false;}
 let nx=e.x+e.vx*dt;if(!blockedAt(nx,e.z,e.y,h))e.x=nx;else e.vx=0;
 let nz=e.z+e.vz*dt;if(!blockedAt(e.x,nz,e.y,h))e.z=nz;else e.vz=0;
 e.x=Math.max(-33.6,Math.min(33.6,e.x));e.z=Math.max(-33.6,Math.min(33.6,e.z));
 e.vy-=20*dt;const ny=e.y+e.vy*dt;
 if(e.vy>0){if(blockedAt(e.x,e.z,ny,h))e.vy=0;else e.y=ny;e.ground=false;}
 else{const g=groundAt(e.x,e.z,e.y);if(ny<=g||(e.ground&&e.y-g<=.4)){e.y=g;e.vy=0;e.ground=true;}else{e.y=ny;e.ground=false;}}
 e.spd=Math.hypot(e.vx,e.vz);
}

  if(Math.abs(d[i])<1e-9){if(o[i]<mn[i]||o[i]>mx[i])return -1;}
  else{let a=(mn[i]-o[i])/d[i],b=(mx[i]-o[i])/d[i],n=-1;if(a>b){const q=a;a=b;b=q;n=1;}
   if(a>t0){t0=a;ax=i;sg=n;}if(b<t1)t1=b;if(t0>t1)return -1;}}
 if(ax<0)return -1;RN=[0,0,0];RN[ax]=sg;return t0;}
function rayWorld(ox,oy,oz,dx,dy,dz,maxT){

 for(const s of MAP.solids){const t=rayBox(ox,oy,oz,dx,dy,dz,s,best);if(t>=0&&t<best){best=t;n=RN;hit=true;}}
 return{t:best,n,hit};}

const NAV={n:140,c:.5,off:35,blk:null};
function buildNav(){const n=NAV.n,b=NAV.blk=new Uint8Array(n*n);

  const i0=Math.max(0,Math.floor((s.x0-.45+NAV.off)/NAV.c)),i1=Math.min(n-1,Math.floor((s.x1+.45+NAV.off)/NAV.c)),j0=Math.max(0,Math.floor((s.z0-.45+NAV.off)/NAV.c)),j1=Math.min(n-1,Math.floor((s.z1+.45+NAV.off)/NAV.c));

const cellOf=(x,z)=>[Math.max(0,Math.min(NAV.n-1,Math.floor((x+NAV.off)/NAV.c))),Math.max(0,Math.min(NAV.n-1,Math.floor((z+NAV.off)/NAV.c)))];

function findPath(x0,z0,x1,z1){
 const n=NAV.n,blk=NAV.blk;let s=freeCell(...cellOf(x0,z0)),g=freeCell(...cellOf(x1,z1));
 const si=s[1]*n+s[0],gi=g[1]*n+g[0];if(si===gi)return[[x1,z1]];
 const gs=new Float32Array(n*n).fill(1e9),from=new Int32Array(n*n).fill(-1),closed=new Uint8Array(n*n);
 const heap=[],push=(k,f)=>{heap.push([f,k]);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};

 gs[si]=0;push(si,0);let found=false,it=0;
 while(heap.length&&it++<30000){const [,k]=pop();if(closed[k])continue;closed[k]=1;if(k===gi){found=true;break;}
  const ci=k%n,cj=(k/n)|0;
  for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;const a=ci+di,b=cj+dj;if(a<0||b<0||a>=n||b>=n)continue;const q=b*n+a;if(blk[q]||closed[q])continue;
   if(di&&dj&&(blk[cj*n+a]||blk[b*n+ci]))continue;const ng=gs[k]+(di&&dj?1.414:1);
   if(ng<gs[q]){gs[q]=ng;from[q]=k;push(q,ng+Math.hypot(g[0]-a,g[1]-b));}}}

 return out;}

function initInput(){
 const cin=document.createElement('input');cin.type='text';cin.id='chatin';cin.hidden=true;cin.maxLength=100;cin.placeholder='Mesaj…';$('#chat').appendChild(cin);
 cin.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=cin.value.trim();if(v)Net.send({t:'chat',m:v});cin.hidden=true;chatOpen=false;cin.blur();if(!G.touch)lockPtr();}else if(e.key==='Escape'){cin.hidden=true;chatOpen=false;cin.blur();}e.stopPropagation();});
 addEventListener('keydown',e=>{
  if(chatOpen)return;const k=e.key.toLowerCase();
  if(G.state!=='game'){return;}
  if(['tab',' ','control','alt'].includes(k)||k.startsWith('arrow'))e.preventDefault();
  if(k==='tab'){G.sbOpen=true;return;}
  if(k==='enter'){openChat();e.preventDefault();return;}
  if(k==='escape'){return;}
  G.keys[k]=true;
  if(k===' ')G.jump=true;
  if(!G.me||G.paused||G.over)return;
  if(k==='r')startReload();if(k==='v')cycleView();if(k==='1')switchTo(0);if(k==='2')switchTo(1);if(k==='3')switchTo(2);
  if(k==='q'){switchTo(G.me.cur===2?0:2);}
 });
 addEventListener('keyup',e=>{const k=e.key.toLowerCase();G.keys[k]=false;if(k==='tab')G.sbOpen=false;});
 addEventListener('blur',()=>{G.keys={};G.fire=G.alt=false;});
 addEventListener('mousemove',e=>{if(G.state==='game'&&document.pointerLockElement){G.mdx+=e.movementX;G.mdy+=e.movementY;}
  if(G.state==='menu'&&M3.dragging){M3.drag+=e.movementX*.012;}});
 $('#gl').addEventListener('mousedown',e=>{if(G.state==='menu'){M3.dragging=true;return;}});

 addEventListener('mousedown',e=>{if(G.state!=='game'||G.paused||G.over||G.touch)return;
  if(e.button===2){e.preventDefault();G.alt=true;G.altPress=true;}
  if(!document.pointerLockElement){lockPtr();return;}

 document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&G.state==='game'&&!G.over&&!G.paused&&!chatOpen&&!G.touch)showPause();});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='game'&&!G.over&&!G.paused)showPause();});

 $('#rot').style.display=(G.touch&&innerHeight>innerWidth)?'grid':'none';
 initTouch();
}
function initTouch(){
 const T={joy:null,look:null,btn:{}};const joy=$('#joy'),knob=$('#knob');
 const hit=(x,y)=>document.elementFromPoint(x,y);
 const btnDown=(id,on)=>{
  switch(id){case 'bFire':G.fire=on;if(on)G.firePress=true;break;
   case 'bRel':if(on)startReload();break;case 'bJump':if(on)G.jump=true;break;
   case 'bCr':if(on){G.crT=!G.crT;$('#bCr').classList.toggle('on',G.crT);}break;
   case 'bScope':if(on){G.altPress=true;G.alt=true;}else G.alt=false;break;case 'bView':if(on)cycleView();break;case 'bSb':if(on){G.sbOpen=!G.sbOpen;}break;case 'bMenu':if(on)showPause();break;}
  const el=$('#'+id);if(el&&id!=='bCr')el.classList.toggle('on',on);};
 const start=e=>{if(G.state!=='game'||!G.touch)return;
  for(const t of e.changedTouches){const el=hit(t.clientX,t.clientY);if(!el)continue;
   if(el.closest('#ov')||el.closest('#chat'))continue;
   const b=el.closest('.tb2'),sl=el.closest('.slot');e.preventDefault();
   if(el.closest('#joy')){T.joy=t.identifier;moveJoy(t);}
   else if(b){T.btn[t.identifier]=b.id;btnDown(b.id,true);}
   else if(sl){switchTo(+sl.dataset.i);}
   else if(T.look===null){T.look=t.identifier;T.lx=t.clientX;T.ly=t.clientY;}}};
 const moveJoy=t=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy;const R=r.width/2,l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';G.joy=[dx/R*1.15,dy/R*1.15];const q=Math.hypot(...G.joy);if(q>1)G.joy=[G.joy[0]/q,G.joy[1]/q];if(q<.12)G.joy=[0,0];};
 const move=e=>{if(G.state!=='game'||!G.touch)return;e.preventDefault();
  for(const t of e.changedTouches){if(t.identifier===T.joy)moveJoy(t);
   else if(t.identifier===T.look){G.mdx+=(t.clientX-T.lx)*1.7*S.tsens;G.mdy+=(t.clientY-T.ly)*1.7*S.tsens;T.lx=t.clientX;T.ly=t.clientY;}}};
 const end=e=>{for(const t of e.changedTouches){if(t.identifier===T.joy){T.joy=null;G.joy=[0,0];knob.style.transform='';}
  if(t.identifier===T.look)T.look=null;if(T.btn[t.identifier]){btnDown(T.btn[t.identifier],false);delete T.btn[t.identifier];}}};
 document.addEventListener('touchstart',start,{passive:false});document.addEventListener('touchmove',move,{passive:false});
 document.addEventListener('touchend',end);document.addEventListener('touchcancel',end);
}

const SESSION_KEY='login_session', SESSION_MS=60*60*1000;
function rememberLogin(u,h){SS(SESSION_KEY,{u,h,expires:Date.now()+SESSION_MS});}
function clearLogin(){try{localStorage.removeItem('hts_'+SESSION_KEY);}catch(e){}}
(async function restoreLogin(){
 const saved=LS(SESSION_KEY);
 if(!saved||!saved.u||!saved.h||!saved.expires||Date.now()>=saved.expires){clearLogin();return;}
 const L=LS('accs')||{};
 if(L[saved.u]===saved.h){await enter(saved.u,null,LS('ad_'+saved.u));return;}
 try{const r=await api('login',{u:saved.u,h:saved.h});if(r&&r.ok){await enter(saved.u,r.tok,r.data||LS('ad_'+saved.u));return;}}catch(e){}
 clearLogin();
})();
window.HTS={logout(){ACC=null;clearLogin();location.reload();}};

// --- Battle Royale (12 kişiye kadar, bot destekli; kişi sayısı zorunlu değil) ---
TEAMC.push([.3,.9,.4],[.95,.8,.2],[.8,.3,.9],[.2,.9,.9],[1,.55,.15],[.9,.9,.9],[.6,.4,.2],[.9,.4,.6],[.4,.5,.9],[.6,.9,.2]);
const BRM=class extends Match{
 constructor(){super({size:6,roundTime:240,freeze:3});this.cfg.win=1;}
 nextRound(){this.round=1;this.phase='freeze';this.timer=this.cfg.freeze;const sl={};this.list().forEach((p,i)=>{p.slot=i;p.hp=100;p.armor=100;p.alive=true;sl[p.id]=i;});this.ev({type:'round',n:1,slots:sl,score:[0,0]});}
 check(){if(this.phase!=='live')return;const al=this.list().filter(p=>p.alive);if(al.length<=1)this.endMatch(al[0]?al[0].team:-1);}
 timeout(){const al=this.list().filter(p=>p.alive).sort((a,b)=>b.k-a.k||b.hp-a.hp);this.endMatch(al[0]?al[0].team:-1);}
};
let BRN=7,BRD=1;
function brSpawn(){const P=G.match.players,sp=[...MAP.spawns[0],...MAP.spawns[1]].sort(()=>Math.random()-.5);let i=0;G.brT=0;G.brOut=[];
 for(const id in P){const en=G.ents[id];if(!en)continue;const q=sp[i++%sp.length];Object.assign(en,{x:q[0],z:q[1],y:0,vx:0,vz:0,vy:0,yaw:Math.random()*6.28,pitch:0,crouch:0,alive:true,hp:100,armor:100,deadT:0,ground:true,tx:q[0],ty:0,tz:q[1],tyaw:0,seen:0});if(en.bot&&G.host)initBotAI(en);}
 if(G.me){resetMe();G.me.w=G.me.slots[0];}G.tr=[];G.fx=[];G.spec=null;banner('BATTLE ROYALE',Object.keys(P).length+' oyuncu · son kalan kazanır',2400);Snd.beep(0);}
function startBR(nb){enforce();resetWorld();G.online=false;G.host=true;G.diff=BRD;G.br=true;G.brT=0;G.brOut=[];G.match=new BRM();
 const me=mkEnt('me',PR.name,0,{local:true});ldToEnt(me,myLd());G.ents.me=me;G.me=me;G.match.add('me',PR.name,0);resetMe();
 for(let i=1;i<=nb;i++){const id='b'+i,nm='BOT '+BOTN[i%BOTN.length],b=mkEnt(id,nm,i,{bot:true});randBotLd(b);initBotAI(b);G.ents[id]=b;G.match.add(id,nm,i,{bot:true});}
 G.match.start();showGame();$('#sub').textContent='BATTLE ROYALE';}
const _o2=onEv;onEv=function(e,r){if(G.br){if(e.type==='round'){brSpawn();return;}if(e.type==='kill')G.brOut.push(e.t);}return _o2.apply(this,arguments);};
const _ss=startOffline;startOffline=function(){G.br=false;return _ss.apply(this,arguments);};
const _ex=exitGame;exitGame=function(){G.br=false;brh.hidden=true;return _ex.apply(this,arguments);};
const brh=document.createElement('div');brh.style.cssText='position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:12;background:#000a;padding:4px 12px;font-size:16px;color:#fff';brh.hidden=true;document.body.appendChild(brh);
const _up=update;update=function(dt){_up.apply(this,arguments);if(!G.br||!G.match||G.online||G.state!=='game'){brh.hidden=true;return;}
 const M=G.match;brh.hidden=false;const al=M.list().filter(p=>p.alive).length;
 if(M.phase!=='live'){brh.textContent='🧍 '+al+'/'+M.list().length;return;}
 G.brT+=dt;const R=Math.max(7,62-Math.max(0,G.brT-25)*.28);let out=false;
 for(const id in M.players){const p=M.players[id],en=G.ents[id];if(!p.alive||!en)continue;const d=Math.hypot(en.x,en.z);
  if(d>R){if(en.local){out=true;G.vig=Math.max(G.vig||0,.45);}p.hp-=(3+G.brT/50)*dt;
   if(p.hp<=0){p.hp=0;p.alive=false;p.d++;M.ev({type:'kill',s:null,t:id,w:'bayonet',hs:0});M.check();}}
  if(en.bot&&d>R-2){const nx=en.x-en.x/d*2.2*dt,nz=en.z-en.z/d*2.2*dt;if(!blockedAt(nx,nz,en.y,1.8)){en.x=nx;en.z=nz;}}}
 brh.innerHTML='🧍 '+al+'/'+M.list().length+' · ⭕ '+Math.round(R)+'m'+(out?' · <b style="color:#ff6a6a">FIRTINADASIN!</b>':'');};
const _se=showEnd;showEnd=function(w,won){if(!G.br)return _se.apply(this,arguments);
 document.exitPointerLock&&document.exitPointerLock();G.over=true;const M=G.match,P=M.players;
 const order=[...M.list().filter(p=>p.alive).map(p=>p.id),...G.brOut.slice().reverse()].filter((v,i,a)=>a.indexOf(v)===i);
 const pl=Math.max(1,order.indexOf('me')+1),n=Math.round((pl===1?200:pl<=3?100:40)*diffMul());
 if(M._pd!==1){M._pd=1;ext();PR.q.m++;if(pl===1)PR.q.w++;PR.coins+=n;coinUi();}
 const rows=order.map((id,i)=>'<tr'+(id==='me'?' class="me"':'')+'><td>'+(i+1)+'</td><td>'+esc(P[id].name)+'</td><td>'+P[id].k+'</td></tr>').join('');
 const o=$('#ov');o.hidden=false;o.innerHTML='<div class="box"><h1 style="color:'+(pl===1?'#6fe0a0':'#ff7a7a')+'">'+(pl===1?'BATTLE ROYALE ZAFERİ':pl+'. SIRA')+'</h1><div class="note">Ödül: +'+n+' 🪙</div><table style="width:100%;text-align:left;font-size:18px"><tr><th>#</th><th>Oyuncu</th><th>Ö</th></tr>'+rows+'</table><button class="btn" id="oAgain">Tekrar Oyna</button><button class="btn alt" id="oMenu">Ana Menü</button></div>';
 $('#oAgain').onclick=()=>startBR(BRN);$('#oMenu').onclick=()=>exitGame();};
// HARDTEKK STRIKE online BR + oda akışı
// Bu kod ana yama IIFE'sinin içinde çalışır; oyunun mevcut motorunu kullanır.
const _enterOnlineHTS = enterOnline;
enterOnline = function(room) {
  if (room && room.mode === 'br') {
    resetWorld(); G.online = true; G.br = true; G.match = new BRM(); G.diff = room.diff;
    syncRoom(room); G.me = G.ents[Net.id];
    if (!G.me) { toast('Oyuncu bilgisi alınamadı.'); return; }
    G.me.local = true; ldToEnt(G.me, myLd()); resetMe(); showGame();
    $('#sub').textContent = 'BATTLE ROYALE';
    return;
  }
  G.br = false;
  return _enterOnlineHTS(room);
};

const _onEvHTS = onEv;
onEv = function(e, remote) {
  if (G.br && e && e.type === 'round') {
    if (remote && G.match) G.match.applyEvent(e);
    G.brOut = []; G.brT = 0;
    // Her oyuncu kendi başlangıç konumunu seçer; konumlar sunucu üzerinden eşitlenir.
    const sp = [...MAP.spawns[0], ...MAP.spawns[1]];
    const q = sp[Math.floor(Math.random() * sp.length)] || [0, 0];
    if (G.me) {
      Object.assign(G.me, { x:q[0], y:0, z:q[1], vx:0, vz:0, vy:0, yaw:Math.random()*6.28,
        pitch:0, crouch:0, alive:true, hp:100, armor:100, deadT:0, ground:true,
        tx:q[0], ty:0, tz:q[1], tyaw:0, seen:0 });
      resetMe();
    }
    G.tr=[]; G.fx=[]; G.spec=null;
    banner('BATTLE ROYALE', G.match.list().length+' oyuncu · son kalan kazanır', 2400);
    Snd.beep(0);
    return;
  }
  return _onEvHTS(e, remote);
};

const _updateHTS = update;
update = function(dt) {
  _updateHTS(dt);
  if (G.br && G.online && G.state === 'game' && G.match && G.me) {
    brh.hidden = false;
    const alive = G.match.list().filter(p => p.alive).length;
    const radius = Math.max(7, 62 - Math.max(0, (G.brT || 0) - 25) * .28);
    const outside = Math.hypot(G.me.x, G.me.z) > radius;
    brh.textContent = '🧍 ' + alive + '/' + G.match.list().length + ' · ⭕ ' + Math.round(radius) + 'm' + (outside ? ' · FIRTINA ALANINDASIN' : '');
  }
};

Net.onmsg = function(m) {
  if (m && m.t === 'br' && G.br) G.brT = Number(m.time) || 0;
};

PANELS.lobby = function() {
  const r = Net.room; if (!r) return PANELS.play();
  const host = r.host === r.me, isBR = r.mode === 'br';
  const list = r.players.map((p, i) => '<div class="pl'+(p.team?' r':'')+'"><b>'+(i+1)+'.</b> '+esc(p.name)+(p.id===r.host?' ★':'')+(p.id===r.me?' (sen)':'')+(p.bot?' · BOT':'')+'</div>').join('') || '<p class="note">Henüz oyuncu yok.</p>';
  const teams = isBR ? '' : '<div class="grid g2"><div class="card"><h3 style="color:#6fb0ff">Mavi Takım ('+r.players.filter(p=>p.team===0).length+'/'+r.size+')</h3>'+r.players.filter(p=>p.team===0).map(p=>'<div class="pl">'+esc(p.name)+(p.id===r.host?' ★':'')+(p.id===r.me?' (sen)':'')+(p.bot?' · BOT':'')+'</div>').join('')+'<button class="btn alt" style="width:100%" data-a="team" data-v="0">Mavi takımı seç</button></div><div class="card"><h3 style="color:#ff6a6a">Kırmızı Takım ('+r.players.filter(p=>p.team===1).length+'/'+r.size+')</h3>'+r.players.filter(p=>p.team===1).map(p=>'<div class="pl r">'+esc(p.name)+(p.id===r.host?' ★':'')+(p.id===r.me?' (sen)':'')+(p.bot?' · BOT':'')+'</div>').join('')+'<button class="btn alt" style="width:100%" data-a="team" data-v="1">Kırmızı takımı seç</button></div></div>';
  const hostOpts = host && !isBR ? '<div class="card"><h3>Maç seçenekleri</h3>'+tog('lbots','Eksik yerleri botlarla doldur',!!r.useBots)+'<p class="note">Kapalıysa sadece gelen oyuncular oynar. Açıkysa maç başlarken boş takım yerleri botlarla tamamlanır.</p></div>' : '';
  return '<h2>Oda <em>/ '+(isBR?'BATTLE ROYALE':r.size+'v'+r.size)+'</em></h2>'
    +'<div class="card"><h3>Oda Kodu</h3><div class="code">'+r.code+'</div><div class="row" style="justify-content:center"><button class="btn alt" data-a="copy" data-v="'+r.code+'">Kodu Kopyala</button></div></div>'
    +'<div class="card"><h3>Oyuncular ('+r.players.filter(p=>!p.bot).length+'/'+(isBR?12:r.size*2)+')</h3>'+list+'</div>'+teams+hostOpts
    +(host?'<button class="btn big" data-a="start">▶ '+(isBR?'BATTLE ROYALE BAŞLAT':'MAÇI BAŞLAT')+'</button>':'<p class="note">Oda sahibinin maçı başlatması bekleniyor…</p>')
    +'<button class="btn red" style="width:100%;margin-top:10px" data-a="leave">Odadan Ayrıl</button>';
};
